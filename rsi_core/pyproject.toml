[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usami-rsi-core"
version = "0.2.0"
description = "Environment-independent executable research and Service co-evolution"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4,<5"]

[project.optional-dependencies]
verl = ["verl==0.9.1; python_version >= '3.10'"]

[tool.setuptools]
packages = ["rsi_core"]
package-dir = {rsi_core = "."}
